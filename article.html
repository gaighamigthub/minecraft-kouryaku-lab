<script src="app.js"></script>
<script>
const id=Number(new URLSearchParams(location.search).get("id"))||1;
const a=articles.find(x=>x.id===id)||articles[0];
document.title=`${a.title}｜マイクラ攻略ラボ`;

</ul>
</div>

<div class="article-toc">
<ol>
${a.sections.map((s,i) => `<li><a href="#section-${i}">${s.title}</a></li>`).join("")}
</ol>
</div>

${a.sections.map((s,i) => `
<section id="section-${i}">
<h2>${i + 1}. ${s.title}</h2>
${s.content}
</section>
`).join("")}

<div class="tip">
<strong>攻略のポイント：</strong>
${a.tip}
</div>

<h2>まとめ</h2>

<p>${a.summary}</p>

const rel=articles.filter(x=>x.id!==a.id && x.cat===a.cat).slice(0,3);
document.getElementById("related").innerHTML=(rel.length?rel:articles.filter(x=>x.id!==a.id).slice(0,3)).map(card).join("");
